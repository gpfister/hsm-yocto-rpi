header:
  version: 14

machine: ${KAS_MACHINE:raspberrypi0-2w-64}
distro: poky
target: hsm-image-base

repos:
  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    branch: blacksail
    layers:
      meta:

  bitbake:
    url: https://git.openembedded.org/bitbake
    branch: "2.20"
    layers:
      .: disabled

  meta-yocto:
    url: https://git.yoctoproject.org/meta-yocto
    branch: blacksail
    layers:
      meta-poky:
      meta-yocto-bsp:

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    branch: blacksail
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-filesystems:

  # No blacksail branch upstream yet: track master (see LAYERSERIES_COMPAT overrides below)
  meta-raspberrypi:
    url: https://github.com/agherzan/meta-raspberrypi.git
    branch: master

  meta-rauc:
    url: https://github.com/rauc/meta-rauc.git
    branch: master

  meta-hsm-os:
    path: meta-hsm-os

local_conf_header:
  base_settings: |
    # Yocto 6.1 (blacksail) compatibility for upstream master branches that do not yet declare it
    LAYERSERIES_COMPAT_raspberrypi:append = " blacksail"
    LAYERSERIES_COMPAT_rauc:append = " blacksail"

    # Distribution and Init Manager
    INIT_MANAGER = "systemd"
    DISTRO_FEATURES:append = " systemd rauc pam"
    DISTRO_FEATURES:remove = "sysvinit"
    VIRTUAL-RUNTIME_init_manager = "systemd"
    VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"

    # Image Packaging and Bootloader
    IMAGE_FSTYPES = "tar.bz2 img wic.bz2 wic.bmap"
    IMAGE_TYPEDEP:img = "wic"
    IMAGE_CMD:img = "ln -f ${IMGDEPLOYDIR}/${IMAGE_NAME}.wic ${IMGDEPLOYDIR}/${IMAGE_NAME}.img"
    WKS_FILE = "sdimage-dual-raspberrypi.wks.in"
    DEPLOY_DIR = "${TOPDIR}/deploy"
    RPI_USE_U_BOOT = "1"
    ENABLE_UART = "1"
    DISABLE_RPI_BOOT_LOGO = "1"
    BOOT_DELAY = "0"
    
    # License Flags (Broadcom / Synaptics wireless firmware for Raspberry Pi)
    LICENSE_FLAGS_ACCEPTED += "synaptics-killswitch"

    # Air-Gapped Machine Features: Remove WiFi and Bluetooth from hardware packages
    MACHINE_FEATURES:remove = "bluetooth wifi"

    # RAUC Keys and Certificates
    RAUC_KEYRING_FILE = "${TOPDIR}/../keys/rauc-ca.cert.pem"
    RAUC_KEY_FILE = "${TOPDIR}/../keys/development-signing.key.pem"
    RAUC_CERT_FILE = "${TOPDIR}/../keys/development-signing.cert.pem"

    # Air-Gapped Network Disablement (no package feed)
    PACKAGE_FEED_URIS = ""
