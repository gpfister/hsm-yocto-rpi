# ==============================================================================
# Linux Kernel Hardening & Air-Gap Lockdown Fragment
# ==============================================================================

# Disallow Wireless, WiFi, and Bluetooth
# CONFIG_WIRELESS is not set
# CONFIG_CFG80211 is not set
# CONFIG_MAC80211 is not set
# CONFIG_BT is not set
# CONFIG_WLAN is not set
# CONFIG_RFKILL is not set

# Disallow Wired Ethernet & USB Network Adapters
# CONFIG_NET_ETHERNET is not set
# CONFIG_USB_NET_DRIVERS is not set
# CONFIG_USB_USBNET is not set
# CONFIG_USB_NET_SMSC95XX is not set
# CONFIG_USB_NET_LAN78XX is not set
# CONFIG_USB_RTL8152 is not set

# Restrict GPIO userspace bus probing
# CONFIG_GPIO_SYSFS is not set

# Enforce Kernel Memory and Structure Hardening
CONFIG_SECURITY=y
CONFIG_SECURITY_NETWORK=y
CONFIG_HARDENED_USERCOPY=y
CONFIG_FORTIFY_SOURCE=y
CONFIG_STRICT_KERNEL_RWX=y
CONFIG_STRICT_MODULE_RWX=y
CONFIG_RANDOMIZE_BASE=y

# Disallow IP protocols (IPv4 and IPv6)
# CONFIG_INET is not set
# CONFIG_IPV6 is not set

# Disallow Netfilter / Packet Filtering (obsolete without IP stacks)
# CONFIG_NETFILTER is not set
# CONFIG_NF_TABLES is not set
# CONFIG_NF_TABLES_INET is not set
# CONFIG_NF_TABLES_NETDEV is not set
# CONFIG_NFT_REJECT is not set
# CONFIG_NFT_REJECT_INET is not set
# CONFIG_NFT_REJECT_IPV4 is not set
# CONFIG_NFT_REJECT_IPV6 is not set

# Retain Local UNIX Domain Sockets & Base Socket Infrastructure for IPC (systemd, udev)
CONFIG_NET=y
CONFIG_UNIX=y

# Support RAM-Only Volatile Overlays & Tmpfs
CONFIG_OVERLAY_FS=y
CONFIG_TMPFS=y
CONFIG_TMPFS_POSIX_ACL=y

# Real-Time Clock (RTC) Subsystem and HW-084 (DS3231) Driver
CONFIG_RTC_CLASS=y
CONFIG_RTC_DRV_DS1307=y
CONFIG_RTC_HCTOSYS=y
CONFIG_RTC_HCTOSYS_DEVICE="rtc0"

# I2C Subsystem & Hardware Controller for Raspberry Pi
CONFIG_I2C=y
CONFIG_I2C_CHARDEV=y
CONFIG_I2C_BCM2835=y

# Disable Boot Logo on Framebuffer Console
# CONFIG_LOGO is not set
# CONFIG_LOGO_LINUX_MONO is not set
# CONFIG_LOGO_LINUX_VGA16 is not set
# CONFIG_LOGO_LINUX_CLUT224 is not set


