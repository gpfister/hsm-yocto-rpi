#!/usr/sbin/nft -f
# ==============================================================================
# nRF52840 HSM OS - Total Air-Gap nftables Ruleset
# 100% Drop: No incoming, outgoing, or routed network traffic allowed.
# ==============================================================================

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;
        drop
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
        drop
    }

    chain output {
        type filter hook output priority filter; policy drop;
        drop
    }
}
