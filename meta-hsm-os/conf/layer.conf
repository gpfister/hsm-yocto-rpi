# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-hsm-os"
BBFILE_PATTERN_meta-hsm-os = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-hsm-os = "10"

LAYERDEPENDS_meta-hsm-os = "core raspberrypi rauc"
LAYERSERIES_COMPAT_meta-hsm-os = "blacksail"
